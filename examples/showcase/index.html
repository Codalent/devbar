<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>devbar: vibecode your app while you use it</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&display=swap" rel="stylesheet">
  <!-- devbar, in development only. Start it with `npx @codalent/devbar`. -->
  <script src="http://127.0.0.1:4711/devbar.js"></script>
  <style>
    :root {
      --mist: #e8ecf1;
      --paper: #f4f6f9;
      --ink: #172033;
      --muted: #5f6b80;
      --line: #cfd6e0;
      --cobalt: #2b3fd6;
      font-family: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
      color: var(--ink);
      background: var(--mist);
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      background:
        radial-gradient(ellipse 60% 50% at 50% 46%, var(--paper), transparent 70%),
        var(--mist);
    }
    a { color: inherit; text-decoration: none; }
    :focus-visible { outline: 2px solid var(--cobalt); outline-offset: 3px; border-radius: 6px; }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px clamp(20px, 5vw, 56px);
      font-size: 15px;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -0.01em; }
    .mark {
      width: 22px; height: 22px; border-radius: 7px;
      background: var(--ink);
      position: relative;
    }
    .mark::after {
      content: ""; position: absolute; inset: 6px 6px 6px 6px;
      border-radius: 50%; background: var(--mist);
    }
    .links { display: flex; gap: 28px; color: var(--muted); }
    .links a:hover { color: var(--ink); }

    main {
      display: grid;
      place-items: center;
      text-align: center;
      padding: 0 24px 6vh;
    }
    h1 {
      font-size: clamp(48px, 8.4vw, 124px);
      font-variation-settings: "opsz" 96;
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: -0.045em;
    }
    h1 span {
      display: block;
      animation: rise 0.9s cubic-bezier(.2, .8, .2, 1) both;
    }
    h1 span:nth-child(2) { animation-delay: 0.08s; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(0.25em); }
      to { opacity: 1; transform: none; }
    }
    .lede {
      margin: 28px auto 0;
      max-width: 40ch;
      text-wrap: balance;
      font-size: clamp(17px, 1.6vw, 20px);
      line-height: 1.5;
      color: var(--muted);
      animation: fade 0.8s 0.45s both;
    }
    .actions {
      margin-top: 36px;
      display: flex;
      gap: 12px;
      justify-content: center;
      animation: fade 0.8s 0.55s both;
    }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .settled h1 span, .settled .lede, .settled .actions { animation: none; }
    .btn {
      font: inherit;
      font-size: 16px;
      font-weight: 500;
      padding: 13px 22px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      cursor: pointer;
    }
    .btn.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
    .btn.primary:hover { background: #26304a; }
    .btn:not(.primary):hover { background: var(--paper); }
    .btn.shake { animation: shake 0.35s; }
    @keyframes shake {
      25% { transform: translateX(-4px); }
      50% { transform: translateX(4px); }
      75% { transform: translateX(-2px); }
    }

    footer {
      padding: 24px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }

    @media (max-width: 560px) {
      .links a:not(:last-child) { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
</head>
<body>
  <nav>
    <a class="brand" href="#"><span class="mark" aria-hidden="true"></span>devbar</a>
    <div class="links">
      <a href="https://github.com/Codalent/devbar#readme">Docs</a>
      <a href="https://github.com/Codalent/devbar">GitHub</a>
      <a href="https://www.npmjs.com/package/@codalent/devbar">npm</a>
    </div>
  </nav>

  <main>
    <div>
      <h1><span>Vibecode your app</span> <span>while you use it</span></h1>
      <p class="lede">See a bug or have an idea while you click around? Log it in two clicks, and your AI agent picks it up from your repo.</p>
      <div class="actions">
        <button class="btn primary" id="start" type="button">Get started</button>
        <button class="btn" type="button">See how it works</button>
      </div>
    </div>
  </main>

  <footer>Free and open source, MIT licensed.</footer>

  <script>
    // Drop the intro animation once it has played, so a screenshot of the page shows it as it looks.
    const actions = document.querySelector(".actions");
    actions.addEventListener("animationend", (e) => {
      if (e.target === actions) document.documentElement.classList.add("settled");
    });

    // A deliberate bug for the demo: "Get started" fails and logs an error.
    const start = document.getElementById("start");
    start.addEventListener("click", () => {
      start.classList.add("shake");
      console.error("POST /api/session failed: 500 Internal Server Error");
    });
    start.addEventListener("animationend", () => start.classList.remove("shake"));
  </script>
</body>
</html>
